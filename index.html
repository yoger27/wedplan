<script>
(function(){
"use strict";
const fmt = n => "Rp" + (Math.round(Number(n)||0)).toLocaleString("id-ID");
const uid = () => Math.random().toString(36).slice(2,9);

let DATA;
try{ DATA = JSON.parse(document.getElementById("seed-data").textContent); }
catch(e){ DATA = {}; }

// ---- local convenience persistence (per-device, immediate) ----
function loadLocal(){
  try{
    const raw = localStorage.getItem("wp_data");
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
function saveLocal(){
  try{ localStorage.setItem("wp_data", JSON.stringify(DATA)); }catch(e){}
}
const local = loadLocal();
if(local) DATA = local;

// ---- shared artifact persistence (cross-device, debounced) ----
let artifactNs = null;
(async function initArtifact(){
  try{
    if(window.claude && window.claude.use){
      artifactNs = await window.claude.use("artifact");
    }
  }catch(e){ artifactNs = null; }
})();

let saveTimer = null;
function scheduleSave(){
  saveLocal();
  showBadge();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(publishState, 1400);
}
function showBadge(){
  const b = document.getElementById("saveBadge");
  b.classList.add("show");
  clearTimeout(showBadge._t);
  showBadge._t = setTimeout(()=>b.classList.remove("show"), 1200);
}
async function publishState(){
  if(!artifactNs) return;
  try{
    const html = buildFullDocument();
    await artifactNs.publish(html);
  }catch(e){ /* conflict or offline: silently keep local copy */ }
}
function buildFullDocument(){
  const doc = document.documentElement.cloneNode(true);
  const seed = doc.querySelector("#seed-data");
  if(seed) seed.textContent = JSON.stringify(DATA);
  return "<!DOCTYPE html>\n" + doc.outerHTML;
}

// ================= TAB DEFINITIONS =================
const TABS = [
  {id:"cover", label:"🏠 Beranda"},
  {id:"anggaran", label:"💐 Anggaran"},
  {id:"seserahan", label:"🎁 Seserahan"},
  {id:"tamu", label:"👰 Tamu"},
  {id:"vendor", label:"🤝 Vendor"},
  {id:"admin", label:"📋 Administrasi"},
  {id:"timeline", label:"🗓️ Timeline"},
];
let activeTab = "cover";

function renderTabs(){
  const el = document.getElementById("tabs");
  el.innerHTML = TABS.map(t=>`<button class="navbtn ${t.id===activeTab?'active':''}" data-tab="${t.id}">${t.label}</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.addEventListener("click", ()=>{ activeTab=b.dataset.tab; renderApp(); window.scrollTo({top:0,behavior:"smooth"}); }));
}

// ================= HELPERS: budget category totals =================
function catTotal(items, field){ return items.reduce((s,it)=>s+(Number(it[field])||0),0); }
function anggaranTotals(){
  let realisasi = 0;
  DATA.anggaran.categories.forEach(c=>{ realisasi += catTotal(c.items,"total"); });
  return { target: Number(DATA.anggaran.target)||0, realisasi, sisa:(Number(DATA.anggaran.target)||0)-realisasi };
}
function seserahanTotals(){
  let realisasi = 0;
  DATA.seserahan.categories.forEach(c=>{ realisasi += catTotal(c.items,"realisasi"); });
  return { target: Number(DATA.seserahan.target)||0, realisasi, sisa:(Number(DATA.seserahan.target)||0)-realisasi };
}
function vendorTotals(){
  const harga = DATA.vendor.reduce((s,v)=>s+(Number(v.harga)||0),0);
  const dp = DATA.vendor.reduce((s,v)=>s+(Number(v.dp)||0),0);
  return { harga, dp, sisa:harga-dp };
}
function tamuTotals(){
  return {
    total: DATA.tamu.length,
    kursi: DATA.tamu.reduce((s,t)=>s+(Number(t.kursi)||0),0),
    terkirim: DATA.tamu.filter(t=>t.status==="Terkirim").length,
    belum: DATA.tamu.filter(t=>t.status!=="Terkirim").length
  };
}
function timelineTotals(){
  return {
    total: DATA.timeline.length,
    selesai: DATA.timeline.filter(t=>t.status==="Selesai").length,
    belum: DATA.timeline.filter(t=>t.status!=="Selesai").length
  };
}
function pill(status){
  const map = {
    "Done":"pill-green","Sudah":"pill-green","Terkirim":"pill-green","Selesai":"pill-green",
    "Proses":"pill-yellow","Sedang Berjalan":"pill-yellow",
    "Belum":"pill-red","Belum Terkirim":"pill-red","Belum Mulai":"pill-red",
    "CPW":"pill-red","CPP":"pill-blue"
  };
  return `<span class="pill ${map[status]||'pill-blue'}">${status}</span>`;
}

// ================= RENDER: COVER =================
function daysLeft(){
  if(!DATA.profile.tanggal) return null;
  const target = new Date(DATA.profile.tanggal+"T00:00:00");
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((target-today)/86400000);
  return diff;
}
function renderCover(){
  const a = anggaranTotals(), s = seserahanTotals(), v = vendorTotals(), t = tamuTotals(), tl = timelineTotals();

  <div class="goldline"></div>
  <div class="field-grid">

    <div class="field"><label>Mempelai Pria</label><input id="p_nama2" value="${esc(DATA.profile.nama2)}" placeholder="Nama mempelai pria"></div>

    <div class="field"><label>Lokasi Acara</label><input id="p_lokasi" value="${esc(DATA.profile.lokasi)}" placeholder="Lokasi"></div>
    <div class="field"><label>Tema / Warna</label><input id="p_tema" value="${esc(DATA.profile.tema)}" placeholder="mis. Dusty Rose & Gold"></div>
    <div class="field"><label>Target Jumlah Tamu</label><input type="number" id="p_target" value="${DATA.profile.targetTamu||0}"></div>
  </div>
  <div class="countdown">${countdownTxt}</div>

  <div class="section-bar">RINGKASAN ANGGARAN</div>
  <div class="card-row">
    <div class="card"><div class="lbl">TOTAL ANGGARAN</div><div class="val">${fmt(a.target)}</div></div>
    <div class="card"><div class="lbl">TOTAL REALISASI</div><div class="val">${fmt(a.realisasi)}</div></div>
    <div class="card"><div class="lbl">SISA ANGGARAN</div><div class="val">${fmt(a.sisa)}</div></div>
  </div>

  <div class="section-bar">RINGKASAN SESERAHAN</div>
  <div class="card-row">
    <div class="card"><div class="lbl">BUDGET SESERAHAN</div><div class="val">${fmt(s.target)}</div></div>
    <div class="card"><div class="lbl">REALISASI SESERAHAN</div><div class="val">${fmt(s.realisasi)}</div></div>
    <div class="card"><div class="lbl">SISA SESERAHAN</div><div class="val">${fmt(s.sisa)}</div></div>
  </div>

  <div class="section-bar">RINGKASAN TAMU</div>
  <div class="card-row">
    <div class="card"><div class="lbl">TOTAL TAMU</div><div class="val">${t.total}</div></div>
    <div class="card"><div class="lbl">TERKIRIM</div><div class="val">${t.terkirim}</div></div>
    <div class="card"><div class="lbl">TOTAL KURSI</div><div class="val">${t.kursi}</div></div>
  </div>

  <div class="section-bar">RINGKASAN VENDOR</div>
  <div class="card-row">
    <div class="card"><div class="lbl">ANGGARAN VENDOR</div><div class="val">${fmt(v.harga)}</div></div>
    <div class="card"><div class="lbl">DP DIBAYAR</div><div class="val">${fmt(v.dp)}</div></div>
    <div class="card"><div class="lbl">SISA DIBAYAR</div><div class="val">${fmt(v.sisa)}</div></div>
  </div>

  <div class="section-bar">RINGKASAN TUGAS PERSIAPAN</div>
  <div class="card-row">
    <div class="card"><div class="lbl">TOTAL TUGAS</div><div class="val">${tl.total}</div></div>
    <div class="card"><div class="lbl">SELESAI</div><div class="val">${tl.selesai}</div></div>
    <div class="card"><div class="lbl">BELUM SELESAI</div><div class="val">${tl.belum}</div></div>
  </div>
  `;
}
function wireCover(){
  const map = {p_nama1:"nama1",p_nama2:"nama2",p_tanggal:"tanggal",p_lokasi:"lokasi",p_tema:"tema"};
  Object.keys(map).forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener("input", ()=>{ DATA.profile[map[id]] = el.value; scheduleSave(); if(id==="p_tanggal") renderApp(); });
  });
  const tgt = document.getElementById("p_target");
  if(tgt) tgt.addEventListener("input", ()=>{ DATA.profile.targetTamu = Number(tgt.value)||0; scheduleSave(); });
}

// ================= RENDER: ANGGARAN & SESERAHAN (generic budget) =================
function renderBudget(kind){
  const isA = kind==="anggaran";
  const store = DATA[kind];
  const totals = isA ? anggaranTotals() : seserahanTotals();
  let html = `
  <div class="banner">${isA?'💐 BUDGET WEDDING PLANNER':'🎁 LIST SESERAHAN'}</div>
  <div class="goldline"></div>
  <div class="card-row">
    <div class="card"><div class="lbl">${isA?'ANGGARAN (TARGET)':'BUDGET SESERAHAN'}</div><div class="val" style="display:flex;align-items:center;justify-content:center;gap:2px;line-height:1;"><span style="line-height:1;">Rp</span><input type="text" inputmode="numeric" id="bt_target" value="${store.target?Number(store.target).toLocaleString('id-ID'):''}" style="width:100%;text-align:center;border:none;background:transparent;font-weight:bold;font-size:1rem;font-family:inherit;line-height:1;color:inherit;padding:0;margin:0;vertical-align:baseline;"></div></div>
    <div class="card"><div class="lbl">TOTAL REALISASI</div><div class="val">${fmt(totals.realisasi)}</div></div>
    <div class="card"><div class="lbl">SISA</div><div class="val" id="bt_sisa">${fmt(totals.sisa)}</div></div>
  </div>`;
  store.categories.forEach((cat, ci)=>{
    const totalCol = isA ? catTotal(cat.items,"total") : catTotal(cat.items,"anggaran");
    const realCol = isA ? null : catTotal(cat.items,"realisasi");
    html += `<div class="cat-block" data-ci="${ci}">
      <div class="cat-head"><input class="cat-name" value="${esc(cat.name)}" style="background:transparent;border:none;font-weight:bold;font-family:inherit;width:75%;color:inherit;"><button class="x" data-act="delcat" data-ci="${ci}">✕ Hapus Kategori</button></div>
      <div class="tbl-wrap"><table><thead><tr>
        ${isA ? "<th>Item</th><th>Status</th><th>Total (Rp)</th><th>DP (Rp)</th><th>Sisa</th><th></th>"
              : "<th>Barang</th><th>Brand</th><th>Anggaran</th><th>Realisasi</th><th>Link Toko</th><th></th>"}
      </tr></thead><tbody>`;
    cat.items.forEach((it, ii)=>{
      if(isA){
        const sisa = (Number(it.total)||0)-(Number(it.dp)||0);
        const sisaTxt = (!it.total) ? "-" : (sisa<=0 ? "Lunas" : "Sisa "+fmt(sisa));
        html += `<tr data-ci="${ci}" data-ii="${ii}">
          <td><input class="f-item" value="${esc(it.item)}"></td>
          <td><select class="f-status">${["Done","Proses","Belum"].map(s=>`<option ${it.status===s?'selected':''}>${s}</option>`).join("")}</select></td>
          <td><input class="f-total" type="number" value="${it.total||''}"></td>
          <td><input class="f-dp" type="number" value="${it.dp||''}"></td>
          <td style="white-space:nowrap;font-size:.72rem;">${sisaTxt}</td>
          <td><button class="rowdel" data-act="delitem" data-ci="${ci}" data-ii="${ii}">🗑</button></td>
        </tr>`;
      } else {
        html += `<tr data-ci="${ci}" data-ii="${ii}">
          <td><input class="f-barang" value="${esc(it.barang)}"></td>
          <td><input class="f-brand" value="${esc(it.brand)}"></td>
          <td><input class="f-anggaran" type="number" value="${it.anggaran||''}"></td>
          <td><input class="f-realisasi" type="number" value="${it.realisasi||''}"></td>
          <td><div style="display:flex;gap:4px;align-items:center;">
            <input class="f-link" type="url" placeholder="https://..." value="${esc(it.link||'')}" style="min-width:90px;">
            <button type="button" class="linkopen" title="Buka link toko">🔗</button>
          </div></td>
          <td><button class="rowdel" data-act="delitem" data-ci="${ci}" data-ii="${ii}">🗑</button></td>
        </tr>`;
      }
    });
    html += `</tbody><tfoot><tr class="tot-row">
      ${isA ? `<td colspan="2">TOTAL KATEGORI</td><td>${fmt(totalCol)}</td><td colspan="3"></td>`
            : `<td colspan="2">TOTAL KATEGORI</td><td>${fmt(totalCol)}</td><td>${fmt(realCol)}</td><td></td><td></td>`}
    </tr></tfoot></table></div>
    <div style="padding:8px 10px;"><button class="btn outline" data-act="additem" data-ci="${ci}" style="font-size:.75rem;padding:5px 10px;">+ Tambah Item</button></div>
    </div>`;
  });
  html += `<div class="btnrow"><button class="btn gold" id="addcat">+ Tambah Kategori</button></div>`;
  return html;
}
function wireBudget(kind){
  const store = DATA[kind];
  const tgt = document.getElementById("bt_target");
  if(tgt) tgt.addEventListener("input", ()=>{
    const raw = tgt.value.replace(/[^0-9]/g,"");
    const num = Number(raw)||0;
    store.target = num;
    const formatted = num ? num.toLocaleString("id-ID") : "";
    tgt.value = formatted;
    tgt.setSelectionRange(formatted.length, formatted.length);
    const totals = kind==="anggaran" ? anggaranTotals() : seserahanTotals();
    const sisaEl = document.getElementById("bt_sisa");
    if(sisaEl) sisaEl.textContent = fmt(totals.sisa);
    scheduleSave();
  });

  document.querySelectorAll(".cat-name").forEach((el,i)=>{
    el.addEventListener("input", ()=>{ store.categories[i].name = el.value; scheduleSave(); });
  });
  document.querySelectorAll('[data-act="delcat"]').forEach(b=>{
    b.addEventListener("click", ()=>{ if(confirm("Hapus kategori ini beserta isinya?")){ store.categories.splice(Number(b.dataset.ci),1); scheduleSave(); renderApp(); } });
  });
  document.querySelectorAll('[data-act="additem"]').forEach(b=>{
    b.addEventListener("click", ()=>{
      const ci = Number(b.dataset.ci);
      store.categories[ci].items.push(kind==="anggaran" ? {item:"",status:"Belum",total:0,dp:0} : {barang:"",brand:"",anggaran:0,realisasi:0,link:""});
      scheduleSave(); renderApp();
    });
  });
  document.getElementById("addcat").addEventListener("click", ()=>{
    store.categories.push({name:"Kategori Baru", items:[]});
    scheduleSave(); renderApp();
  });
  document.querySelectorAll('[data-act="delitem"]').forEach(b=>{
    b.addEventListener("click", ()=>{ store.categories[Number(b.dataset.ci)].items.splice(Number(b.dataset.ii),1); scheduleSave(); renderApp(); });
  });
  document.querySelectorAll("tr[data-ci]").forEach(tr=>{
    const ci = Number(tr.dataset.ci), ii = Number(tr.dataset.ii);
    tr.querySelectorAll("input,select").forEach(inp=>{
      const field = inp.className.replace("f-","");
      inp.addEventListener("input", ()=>{
        const val = inp.type==="number" ? Number(inp.value)||0 : inp.value;
        store.categories[ci].items[ii][field] = val;
        scheduleSave();
        if(inp.type==="number" || inp.tagName==="SELECT") renderApp(); else {/* keep focus for text */}
      });
    });
  });
  document.querySelectorAll(".linkopen").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const input = btn.previousElementSibling;
      let url = (input.value||"").trim();
      if(!url){ alert("Isi dulu link toko/pembayarannya ya."); return; }
      if(!/^https?:\/\//i.test(url)) url = "https://" + url;
      window.open(url, "_blank", "noopener");
    });
  });
}

function wireSimpleList(arr, prefixSelector, rerenderOnChange){
  document.querySelectorAll(`tr[data-i]`).forEach(tr=>{
    const i = Number(tr.dataset.i);
    tr.querySelectorAll("input,select").forEach(inp=>{
      const field = inp.className.replace("f-","");
      inp.addEventListener("input", ()=>{
        arr[i][field] = inp.type==="number" ? Number(inp.value)||0 : inp.value;
        scheduleSave();
        if(rerenderOnChange) renderApp();
      });
    });
  });
  document.querySelectorAll('[data-act="del"]').forEach(b=>{
    b.addEventListener("click", ()=>{ arr.splice(Number(b.dataset.i),1); scheduleSave(); renderApp(); });
  });
}

// ================= RENDER: ADMINISTRASI =================
function renderAdmin(){
  const totW = DATA.administrasi.wanita.reduce((s,x)=>s+(Number(x.biaya)||0),0);
  const totP = DATA.administrasi.pria.reduce((s,x)=>s+(Number(x.biaya)||0),0);
  function block(list, key, title){
    let h = `<div class="section-bar">${title}</div><div class="tbl-wrap"><table><thead><tr><th>No</th><th>Syarat</th><th>Biaya</th><th>Status</th><th></th></tr></thead><tbody>`;
    list.forEach((x,i)=>{
      h += `<tr data-i="${i}" data-key="${key}">
        <td>${i+1}</td>
        <td><input class="f-nama" value="${esc(x.nama)}"></td>
        <td><input class="f-biaya" type="number" value="${x.biaya||0}"></td>
        <td><select class="f-status">${["Sudah","Belum"].map(o=>`<option ${x.status===o?'selected':''}>${o}</option>`).join("")}</select></td>
        <td><button class="rowdel" data-act="del" data-key="${key}" data-i="${i}">🗑</button></td>
      </tr>`;
    });
    h += `<tr class="tot-row"><td colspan="2">TOTAL</td><td>${fmt(key==="wanita"?totW:totP)}</td><td colspan="2"></td></tr>`;
    h += `</tbody></table></div><div class="btnrow"><button class="btn outline" data-act="add" data-key="${key}" style="font-size:.75rem;padding:5px 10px;">+ Tambah Syarat</button></div>`;
    return h;
  }
  return `<div class="banner">📋 ADMINISTRASI PERSIAPAN PERNIKAHAN</div><div class="goldline"></div>`
    + block(DATA.administrasi.wanita,"wanita","SYARAT CALON PENGANTIN WANITA")
    + block(DATA.administrasi.pria,"pria","SYARAT CALON PENGANTIN PRIA")
    + `<div class="section-bar">ALUR PENDAFTARAN PERNIKAHAN KE KUA</div>
       <ol style="font-size:.82rem;line-height:1.7;padding-left:20px;">
       <li>Datang ke RT/RW mengurus surat pengantar nikah (bawa KK dan KTP)</li>
       <li>Pemeriksaan kesehatan calon pengantin &amp; memperoleh surat keterangan sehat</li>
       <li>Datang ke Kelurahan untuk mendapatkan surat N1–N4</li>
       <li>Ajukan pendaftaran kehendak nikah secara online (SIMKAH) atau langsung ke KUA</li>
       <li>Ikuti bimbingan perkawinan sebagai bagian dari proses sebelum pernikahan</li>
       </ol>`;
}
function wireAdmin(){
  document.querySelectorAll("tr[data-key]").forEach(tr=>{
    const key = tr.dataset.key, i = Number(tr.dataset.i);
    tr.querySelectorAll("input,select").forEach(inp=>{
      const field = inp.className.replace("f-","");
      inp.addEventListener("input", ()=>{
        DATA.administrasi[key][i][field] = inp.type==="number" ? Number(inp.value)||0 : inp.value;
        scheduleSave();
        if(inp.type==="number"||inp.tagName==="SELECT") renderApp();
      });
    });
  });
  document.querySelectorAll('[data-act="del"]').forEach(b=>{
    b.addEventListener("click", ()=>{ DATA.administrasi[b.dataset.key].splice(Number(b.dataset.i),1); scheduleSave(); renderApp(); });
  });
  document.querySelectorAll('[data-act="add"]').forEach(b=>{
    b.addEventListener("click", ()=>{ DATA.administrasi[b.dataset.key].push({nama:"",biaya:0,status:"Belum"}); scheduleSave(); renderApp(); });
  });
}

// ================= MASTER RENDER =================
function esc(s){ return (s===undefined||s===null?"":String(s)).replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

function renderApp(){
  renderTabs();
  const app = document.getElementById("app");
  if(activeTab==="cover"){ app.innerHTML = renderCover(); wireCover(); }
  else if(activeTab==="anggaran"){ app.innerHTML = renderBudget("anggaran"); wireBudget("anggaran"); }
  else if(activeTab==="seserahan"){ app.innerHTML = renderBudget("seserahan"); wireBudget("seserahan"); }
  else if(activeTab==="tamu"){
    app.innerHTML = renderTamu();
    wireSimpleList(DATA.tamu, "tr[data-i]", true);
    document.getElementById("addrow").addEventListener("click", ()=>{ DATA.tamu.push({nama:"",dari:"CPW",hubungan:"Keluarga",jenis:"Cetak",kursi:1,status:"Belum Terkirim"}); scheduleSave(); renderApp(); });
  }
  else if(activeTab==="vendor"){
    app.innerHTML = renderVendor();
    wireSimpleList(DATA.vendor, "tr[data-i]", true);
    document.getElementById("addrow").addEventListener("click", ()=>{ DATA.vendor.push({kategori:"",nama:"",kontak:"",harga:0,dp:0,catatan:""}); scheduleSave(); renderApp(); });
  }
  else if(activeTab==="admin"){ app.innerHTML = renderAdmin(); wireAdmin(); }
  else if(activeTab==="timeline"){
    app.innerHTML = renderTimeline();
    wireSimpleList(DATA.timeline, "tr[data-i]", true);
    document.getElementById("addrow").addEventListener("click", ()=>{ DATA.timeline.push({tugas:"",tenggat:"",pic:"",prioritas:"Sedang",status:"Belum Mulai",catatan:""}); scheduleSave(); renderApp(); });
  }
}

renderApp();
})();
